[ui]
sidebar_width = 34

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "$repo", bold = true }, { token = "$role", rules = [{ equals = "orchestrator", fg = "#cdd6f4", bold = true }, { equals = "implementer", fg = "#89b4fa" }, { equals = "reviewer", fg = "#f5c2e7" }, { equals = "explorer", fg = "#94e2d5" }, { equals = "fixer", fg = "#b4befe" }] }],
  [{ token = "$model", bold = true }, { token = "$effort", rules = [{ contains = "xhigh", fg = "#d75f5f" }, { contains = "max", fg = "#af87d7" }, { contains = "high", fg = "#d7875f" }, { contains = "medium", fg = "#d7af5f" }, { contains = "low", fg = "#87af87" }] }],
  [{ token = "terminal_title_stripped", dim = true }],
]
