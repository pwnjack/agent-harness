[ui]
sidebar_width = 34

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "$model", bold = true }, { token = "$effort", rules = [{ equals = "low", fg = "#87af87" }, { equals = "medium", fg = "#d7af5f" }, { equals = "high", fg = "#d7875f" }, { equals = "xhigh", fg = "#d75f5f" }, { equals = "max", fg = "#af87d7" }] }],
  ["$repo", { token = "$role", dim = true }],
]
