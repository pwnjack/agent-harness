model = "x" # keep this comment

# features block
[features]
hooks = true
memories = false

[profiles.fast]
model = "fast-model"
effort = "low"

# docs server

[mcp_servers.docs]
command = "docs-server"
args = [
  "--stdio",
  "--quiet",
]
env = { A = "1" }

[tui]
status_line = ["model-with-reasoning", "context-used", "used-tokens", "context-window-size", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
terminal_title = ["spinner", "thread-title"]
